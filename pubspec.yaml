name: stokio
description: Controle de estoque simples para pequenos negócios.
publish_to: 'none'
version: 1.9.1+19

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.5.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3
  google_mlkit_barcode_scanning: ^1.0.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  cloud_functions: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/stokio.png
    - assets/catalogo_inicial.json
    - assets/catalogo_produtos.json
