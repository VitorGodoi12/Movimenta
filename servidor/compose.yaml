services:
  api:
    build: .
    restart: unless-stopped
    environment:
      STOKIO_HOST: 0.0.0.0
      STOKIO_DATA: /dados
      STOKIO_PROXY_PRIVADO: '1'
      STOKIO_WEB_ORIGINS: ${STOKIO_WEB_ORIGINS:-}
      STOKIO_SMTP_HOST: ${STOKIO_SMTP_HOST:-}
      STOKIO_SMTP_PORT: ${STOKIO_SMTP_PORT:-587}
      STOKIO_EMAIL_FROM: ${STOKIO_EMAIL_FROM:-}
      STOKIO_SMTP_USER: ${STOKIO_SMTP_USER:-}
      STOKIO_SMTP_PASSWORD: ${STOKIO_SMTP_PASSWORD:-}
    volumes:
      - estoque:/dados
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STOKIO_DOMINIO: ${STOKIO_DOMINIO:?Informe o domínio do servidor no arquivo .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
      - caddy_config:/config

volumes:
  estoque:
  certificados:
  caddy_config:
